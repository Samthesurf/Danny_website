<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 240 240"
    width="240"
    height="240"
>
  <defs>
    <clipPath id="d-clip">
      <path d="M 70 40 L 120 40 A 80 80 0 0 1 120 200 L 70 200 Z" />
    </clipPath>
  </defs>

  <!-- Solid blue D: flat left, rounded right -->
  <path fill="#1B5FC1" d="M 70 40 L 120 40 A 80 80 0 0 1 120 200 L 70 200 Z" />

  <!-- Three nested white chevrons, parallel, pointing right -->
  <g
        clip-path="url(#d-clip)"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
    <path d="M 62 70 L 170 120 L 62 170" />
    <path d="M 62 90 L 130 120 L 62 150" />
    <path d="M 62 110 L 90 120 L 62 130" />
  </g>
</svg>
